<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EFLIGHT">
  <!--
    Tab mark for EFLIGHT AI. Uses the app's own brand gradient
    (#38BDF8 -> #6366F1 -> #A855F7, the same ramp as .brand-mark).

    The plane is a solid top-down silhouette rather than the stroked
    outline used in the UI: at 16px a 1.7px stroke collapses into grey
    mush, whereas a filled shape keeps its outline.
  -->
  <defs>
    <linearGradient id="eflight-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="eflight-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#eflight-g)"/>
  <rect width="64" height="64" rx="15" fill="url(#eflight-sheen)"/>

  <!--
    Airliner seen from above, nose up. Deliberately heavy: a slimmer,
    more realistic silhouette disappeared at 16px because the wings fell
    below one pixel. Fuselage and wing roots are thickened and the shape
    spans almost the full tile so it still reads as a plane in a tab.
    Symmetric about x=32.
  -->
  <path fill="#FFFFFF" d="
    M 32 5.5
    C 34.9 5.5 37.2 9.2 37.2 13.8
    L 37.2 22.4
    L 59 34.8
    L 59 41.2
    L 37.2 35
    L 37.2 44.6
    L 44.2 49.6
    L 44.2 54.6
    L 32 51.2
    L 19.8 54.6
    L 19.8 49.6
    L 26.8 44.6
    L 26.8 35
    L 5 41.2
    L 5 34.8
    L 26.8 22.4
    L 26.8 13.8
    C 26.8 9.2 29.1 5.5 32 5.5
    Z"/>
</svg>
