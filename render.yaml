services:
  - type: web
    name: eflightops-api
    runtime: python
    plan: free
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    # server.py guards app.run() behind __main__, so gunicorn imports the
    # module and serves `app` directly — the Flask dev server never starts.
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120
    # No PUBLIC_BASE_URL here on purpose. The /convert response embeds an
    # absolute URL in the PDF download link, and Render already injects
    # RENDER_EXTERNAL_URL with the full public address - server.py reads
    # that. A `fromService: property: host` override resolves to the bare
    # internal service name and silently breaks every download.
