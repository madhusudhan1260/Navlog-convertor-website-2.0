services:
  - type: web
    name: eflight-api
    runtime: python
    plan: free
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    # server.py guards app.run() behind __main__, so gunicorn imports the
    # module and serves `app` directly — the Flask dev server never starts.
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      # Must be the backend's own public URL: the /convert response embeds
      # it in the download link the browser follows to fetch the PDF.
      # Render fills this with a bare hostname (no scheme); server.py
      # prefixes https:// when it sees one.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: eflight-api
          property: host
